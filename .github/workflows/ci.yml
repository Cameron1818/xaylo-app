name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xaylo
          POSTGRES_PASSWORD: xaylo
          POSTGRES_DB: xaylo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xaylo -d xaylo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database: the integration test migrates it and creates/deletes only marked fixtures.
      TEST_DATABASE_URL: postgres://xaylo:xaylo@localhost:5432/xaylo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
